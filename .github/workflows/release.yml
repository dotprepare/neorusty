name: Release

on:
  push:
    branches:
      - '26.*'                 # Mainline release branches 
      - '[0-9][0-9]w14[a-z]+' # w14 April Fools Snapshots
    tags:
      - 'v*.*.*'           # Manual releases

permissions:
  contents: read
  statuses: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./neoforge-source
    if: ${{ github.repository == 'neoforged/NeoForge' }}
    steps:
      - name: Checkout repository
        uses: neoforged/actions/checkout@main

      - name: Setup JDK
        uses: neoforged/actions/setup-java@main
        with:
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup with Gradle
        run: ./gradlew setup

      - name: Publish
        run: ./gradlew publish -Pinclude_artifacts_in_installer=false
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_SUBKEY: ${{ secrets.GPG_SUBKEY }}
          GPG_SUBKEY_ID: ${{ secrets.GPG_SUBKEY_ID }}
          GPG_SUBKEY_PASSWORD: ${{ secrets.GPG_SUBKEY_PASSWORD }}
