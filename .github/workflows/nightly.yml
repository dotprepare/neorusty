name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - 'dev-*'
      - 'main'
      - 'master'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./neoforge-source
    steps:
      - name: Checkout repository
        uses: neoforged/actions/checkout@main

      - name: Setup JDK
        uses: neoforged/actions/setup-java@main
        with:
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup with Gradle
        run: ./gradlew setup

      - name: Build with Gradle
        run: ./gradlew assemble checkFormatting

      - name: Run tests
        run: ./gradlew :tests:runUnitTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-build
          path: neoforge-source/build/libs/

      - name: Create nightly release
        run: |
          TAG="nightly-$(date +'%Y%m%d')"
          gh release create "$TAG" \
            --title "Nightly Build $(date +'%Y-%m-%d')" \
            --notes "Automated nightly build from ${{ github.ref_name }} (${{ github.sha }})" \
            --target "${{ github.sha }}" \
            neoforge-source/build/libs/*.jar || true
        env:
          GH_TOKEN: ${{ github.token }}
