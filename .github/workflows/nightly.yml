name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - 'dev-*'
      - 'main'
      - 'master'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-neoforge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./patched-neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: ./gradlew :neoforge:setup -PvalidateAccessTransformers -Poverride_version=0.0.0-nightly-$(date +'%Y%m%d') || true
      - run: ./gradlew assemble -x createChangelog -Poverride_version=0.0.0-nightly-$(date +'%Y%m%d') || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: neoforge-build
          path: patched-neoforge/build/libs/

  build-neorusty:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./neorusty-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release
      - run: cargo test --release || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: neorusty-build
          path: neorusty-source/target/release/

  create-release:
    needs: [build-neoforge, build-neorusty]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Create nightly release
        shell: bash
        run: |
          TAG="nightly-$(date +'%Y%m%d')"
          NOTES=$(cat <<EOF
          **Nightly Build** from \`${{ github.ref_name }}\` (${{ github.sha }})

          ### NeoForge
          - Java build artifacts (patched-neoforge/)

          ### Neorusty
          - Rust binary and libraries (neorusty-source/)

          ---
          _Automated build_ — $(date -u)
          EOF
          )

          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            --title "Nightly Build $(date +'%Y-%m-%d')" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            ./* 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}
