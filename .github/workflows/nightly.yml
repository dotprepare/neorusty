name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - 'dev-*'
      - 'main'
      - 'master'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-neoforge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./patched-neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Restore NeoForge source files
        run: bash setup-sources.sh

      - run: ./gradlew :neoforge:setup -PvalidateAccessTransformers -Poverride_version=0.0.0-nightly-$(date +'%Y%m%d')
      - run: ./gradlew assemble -x createChangelog -Poverride_version=0.0.0-nightly-$(date +'%Y%m%d')
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: neoforge-build
          path: patched-neoforge/build/libs/

  build-neorusty:
    name: Build neorusty (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
    defaults:
      run:
        working-directory: ./neorusty-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: neorusty-source
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          for crate in neorusty-cli neorusty-installer server-core; do
            bin="target/${{ matrix.target }}/release/${crate}${{ matrix.suffix }}"
            if [ -f "$bin" ]; then
              cp "$bin" "dist/${crate}-${{ matrix.target }}${{ matrix.suffix }}"
            fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: neorusty-${{ matrix.target }}
          compression-level: 9
          path: neorusty-source/dist/neorusty-*

  create-release:
    permissions:
      contents: write
    needs: [build-neoforge, build-neorusty]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: dist/
          merge-multiple: true
      - name: Generate release notes
        run: |
          cat > dist/RELEASE.md <<EOF
          **Nightly Build** — $(date -u +"%Y-%m-%d %H:%M") UTC

          From commit: ${{ github.sha }}
          Branch: \`${{ github.ref_name }}\`

          ### NeoForge (Java)
          - Patched NeoForge server
          - Build: patched-neoforge/

          ### Neorusty (Rust)
          - **neorusty-cli** — CLI tool
          - **neorusty-installer** — Installer
          - **server-core** — Server core
          - Architectures: x86_64 (Linux/macOS/Windows), ARM64 (Linux/macOS)

          ### Platforms
          - Linux (x86_64, ARM64)
          - macOS (x86_64, ARM64)
          - Windows (x86_64)
          EOF
      - name: Update nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag --force nightly
          git push --force origin tag nightly
      - name: Draft nightly release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          files: dist/*
          tag_name: nightly
          name: Nightly Build
          body_path: dist/RELEASE.md
