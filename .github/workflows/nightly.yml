name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - 'dev-*'
      - 'main'
      - 'master'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-neoforge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./patched-neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: ./gradlew :neoforge:setup -PvalidateAccessTransformers -Poverride_version=0.0.0-nightly-$(date +'%Y%m%d') || true
      - run: ./gradlew assemble -x createChangelog -Poverride_version=0.0.0-nightly-$(date +'%Y%m%d') || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: neoforge-build
          path: patched-neoforge/build/libs/

  build-neorusty:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./neorusty-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release
      - run: cargo test --release || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: neorusty-build
          path: neorusty-source/target/release/

  create-release:
    permissions:
      contents: write
    needs: [build-neoforge, build-neorusty]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: dist/
          merge-multiple: true
      - name: Generate release notes
        run: |
          cat > dist/RELEASE.md <<EOF
          **Nightly Build** — $(date -u +"%Y-%m-%d %H:%M") UTC

          From commit: ${{ github.sha }}
          Branch: \`${{ github.ref_name }}\`

          ### NeoForge
          - Java build artifacts (patched-neoforge/)

          ### Neorusty
          - Rust binary and libraries (neorusty-source/)

          ---
          _Automated build_
          EOF
      - name: Update nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag --force nightly
          git push --force origin tag nightly
      - name: Draft nightly release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          files: dist/*
          tag_name: nightly
          name: Nightly Build
          body_path: dist/RELEASE.md
