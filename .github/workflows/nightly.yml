name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - 'dev-*'
      - 'main'
      - 'master'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-neoforge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./patched-neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: ./gradlew :neoforge:setup -PvalidateAccessTransformers -Poverride_version=0.0.0-nightly-$(date +'%Y%m%d') || true
      - run: ./gradlew assemble -x createChangelog -Poverride_version=0.0.0-nightly-$(date +'%Y%m%d') || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: neoforge-build
          path: patched-neoforge/build/libs/

  build-neorusty:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./neorusty-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release
      - run: cargo test --release || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: neorusty-build
          path: neorusty-source/target/release/

  create-release:
    needs: [build-neoforge, build-neorusty]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
      - name: Create nightly release
        run: |
          TAG="nightly-$(date +'%Y%m%d')"

          # Remove previous nightly release with same tag if exists
          gh release delete "$TAG" --yes --repo ${{ github.repository }} 2>/dev/null || true

          # Remove previous git tag if exists
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          # Create new release with all build artifacts
          gh release create "$TAG" \
            --title "Nightly Build $(date +'%Y-%m-%d')" \
            --notes "**Nightly Build** from \`${{ github.ref_name }}\` (${{ github.sha }})

        ### NeoForge
        - Java build artifacts
        - Minecraft $(cat patched-neoforge/build/libs/*.jar 2>/dev/null | head -1 || echo "latest")

        ### Neorusty
        - Rust binary and libraries
        - Built from neorusty-source/

        ---
        _Automated build_ — $(date -u)" \
            --target "${{ github.sha }}" \
            ./* 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}
